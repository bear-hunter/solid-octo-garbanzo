services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credentials
      POSTGRES_PASSWORD: credentials
      POSTGRES_DB: credentials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  ipfs:
    image: ipfs/kubo:v0.30.0
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
volumes:
  postgres_data:
  ipfs_data:
